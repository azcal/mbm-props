name: mbm-props-daily
# NBA and WNBA tip in the evening, so the board lands late morning with a mid-afternoon
# refresh that only reports what moved. Two cron lines per target because GitHub Actions
# runs on UTC and ignores daylight saving.
on:
  schedule:
    - cron: "0 16 * 3-10 *"       # 10:00am MDT
    - cron: "0 17 * 1-2,11-12 *"  # 10:00am MST
    - cron: "0 22 * 3-10 *"       # 4:00pm MDT
    - cron: "0 23 * 1-2,11-12 *"  # 4:00pm MST
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: python -c "import daily_props"
      - run: python daily_props.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      - name: commit state
        run: |
          mkdir -p logs && date > logs/last_run.txt
          git config user.name mbm-bot && git config user.email bot@mbm
          git add data/ logs/ && git diff --cached --quiet || git commit -m "props $(date +%F)"
          git push
